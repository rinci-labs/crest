# Test, lint, and build on every push to main and every pull request.
# Runs on Blacksmith Windows runners (faster than windows-latest, with a co-located cache that
# Swatinem/rust-cache uses transparently). The three jobs run in parallel.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are never reused in CI and only make the cache bigger.
  CARGO_INCREMENTAL: 0
  # No debug info for test builds: faster compile and link, smaller cache.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  test:
    name: Test
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Before the cache step, because the cache key includes the rustc version.
      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # Only main writes the cache; PRs restore it without filling it with branch builds.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test
        run: cargo test --locked

  clippy:
    name: Clippy
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  build:
    name: Release build
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Release build
        run: cargo build --release --locked
